<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Fated - Register</title>
 <link rel="stylesheet" href="css/register.css" />
</head>
<body>
 <div class="register-container">
    <div class="header">
     <div class="logo-icon">❤️</div>
        <h1 class="logo-text">FATED</h1>
    </div>

    <div class="tabs">
     <button class="tab-button login">LOGIN</button>
     <button class="tab-button register active">REGISTER</button>
    </div>

    <form class="register-form">
     <input type="text" placeholder="user name" class="input-field" />
     <input type="password" placeholder="password" class="input-field" />
     <input type="email" placeholder="email" class="input-field" />

     <p class="forgot-password">FORGOT PASSWORD?</p>

     <button type="submit" class="main-register-button">REGISTER</button>
    </form>

    <p class="login-prompt">
     ALREADY HAVE AN ACCOUNT? <a href="#" class="login-link">LOGIN</a>
    </p>
 </div>
</body>
</html>
